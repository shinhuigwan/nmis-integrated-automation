name: Build and publish Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'packaging/**'
      - 'tools/**'
      - 'requirements*'
      - 'build_portable.ps1'
      - '.github/workflows/portable-release.yml'
permissions:
  contents: write
concurrency:
  group: portable-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-portable.lock
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Set release version
        shell: pwsh
        run: |
          $date = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Korea Standard Time').ToString('yyyy.MM.dd')
          $version = "$date.${{ github.run_number }}"
          Set-Content app_version.py ('APP_VERSION = "' + $version + '"') -Encoding ascii
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build portable app
        shell: pwsh
        run: ./build_portable.ps1 -Python (Get-Command python).Source
      - name: Verify executable
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'probe.json'
          $process = Start-Process ./dist/NMIS-Automation/NMIS-Automation.exe -ArgumentList @('--update-probe', $report) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Get-Content $report -Raw | ConvertFrom-Json).ok) { throw 'Portable verification failed.' }
      - name: Package verified release
        run: python tools/package_portable.py dist/NMIS-Automation dist/NMIS-Automation-Windows-x64.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $notes = "Windows portable app $env:APP_VERSION. Python included. User settings and data are preserved during in-app updates. Source: $env:GITHUB_SHA"
          Set-Content release-notes.txt $notes -Encoding utf8
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/NMIS-Automation-Windows-x64.zip dist/NMIS-Automation-Windows-x64.zip.sha256 --clobber
          } else {
            gh release create $tag dist/NMIS-Automation-Windows-x64.zip dist/NMIS-Automation-Windows-x64.zip.sha256 --draft --target $env:GITHUB_SHA --title "NMIS $env:APP_VERSION" --notes-file release-notes.txt
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          gh release edit $tag --draft=false --latest
